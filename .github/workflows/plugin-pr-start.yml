name: Start plugin contribution PR

on:
    pull_request_target:
        types: [opened]
        paths:
            - 'plugins.json'
    issue_comment:
        types: [created]

permissions:
    contents: read
    pull-requests: write

jobs:
    start-plugin-contrib-pr:
        if: |
            ${{ github.event_name == 'pull_request' || (github.event.issue.pull_request && github.event.comment.body == '/rubric') }}
        runs-on: ubuntu-latest
        env:
            PR_NUMBER: ${{ github.event.number }}
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@v6

            - name: Post the reviewer checklist
              shell: bash
              run: |
                  gh pr comment "$PR_NUMBER" --body-file="review-rubric.md"
